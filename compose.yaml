services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobagent
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent-local
    ports:
      - "5432:5432"
    volumes:
      - jobagent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d jobagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - jobagent-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: jobagent-local
      MINIO_ROOT_PASSWORD: jobagent-local-secret
      # Disposable local KMS key for exercising SSE-S3 in integration tests.
      MINIO_KMS_SECRET_KEY: jobagent-local:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - jobagent-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 jobagent-local jobagent-local-secret && mc mb --ignore-existing local/jobagent-private-documents && mc anonymous set none local/jobagent-private-documents && mc version enable local/jobagent-private-documents && mc encrypt set sse-s3 local/jobagent-private-documents"]

volumes:
  jobagent-postgres:
  jobagent-redis:
  jobagent-minio:
