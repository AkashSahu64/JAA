services:
  postgres:
    image: pgvector/pgvector@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobagent}
      POSTGRES_USER: ${POSTGRES_USER:-jobagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobagent-local}
    ports:
      - "5432:5432"
    volumes:
      - jobagent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobagent} -d $${POSTGRES_DB:-jobagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - jobagent-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: jobagent-local
      MINIO_ROOT_PASSWORD: jobagent-local-secret
      # Disposable local KMS key for exercising SSE-S3 in integration tests.
      MINIO_KMS_SECRET_KEY: jobagent-local:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - jobagent-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 jobagent-local jobagent-local-secret && mc mb --ignore-existing local/jobagent-private-documents && mc anonymous set none local/jobagent-private-documents && mc version enable local/jobagent-private-documents && mc encrypt set sse-s3 local/jobagent-private-documents"]

volumes:
  jobagent-postgres:
  jobagent-redis:
  jobagent-minio:
